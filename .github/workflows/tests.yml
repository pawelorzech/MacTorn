name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo's Package.resolved is in Xcode 16's PinsStorage v3 format, which the
      # previously-pinned Xcode 15.2 cannot parse ("unknown 'PinsStorage' version '3'"),
      # so every job failed package resolution. Use the latest stable Xcode on the image.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -destination 'platform=macOS' \
            -only-testing:MacTornTests \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --report junit

      # ISC-20: reliability-critical modules must stay >= 80% line-covered (views excluded —
      # they are validated by the UI-test job, not line coverage).
      - name: Coverage gate (critical modules)
        run: bash scripts/coverage-gate.sh TestResults.xcresult 80

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: TestResults.xcresult

  ui-tests:
    name: UI Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Run UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -destination 'platform=macOS' \
            -only-testing:MacTornUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color

  build:
    name: Build Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: |
          xcodebuild build \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive Build
        run: |
          xcodebuild archive \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -destination 'generic/platform=macOS' \
            -archivePath build/MacTorn.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
