name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo's Package.resolved is in Xcode 16's PinsStorage v3 format, which the
      # previously-pinned Xcode 15.2 cannot parse ("unknown 'PinsStorage' version '3'"),
      # so every job failed package resolution. Use the latest stable Xcode on the image.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -destination 'platform=macOS' \
            -only-testing:MacTornTests \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color --report junit

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: TestResults

  ui-tests:
    name: UI Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Run UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -destination 'platform=macOS' \
            -only-testing:MacTornUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty --color
        # TODO(Etap G): remove continue-on-error once the deterministic UI-test harness
        # lands so UI tests block merges. Kept non-blocking for now to isolate this
        # CI-infra fix from the (separate) UI-test hardening work.
        continue-on-error: true

  build:
    name: Build Release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: |
          xcodebuild build \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive Build
        run: |
          xcodebuild archive \
            -project MacTorn/MacTorn.xcodeproj \
            -scheme MacTorn \
            -destination 'generic/platform=macOS' \
            -archivePath build/MacTorn.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
